  - name: dim_employee_validation
    mapping_mode: query_to_query
    source:
      connection: source_postgres
      query: |
        SELECT TRIM(e.nationalidnumber) AS "EmployeeNationalIDAlternateKey", TRIM(mgr.nationalidnumber) AS "ParentEmployeeNationalIDAlternateKey", addr_sp.territoryid AS "SalesTerritoryAlternateKey", TRIM(p.firstname) AS "FirstName", TRIM(p.lastname) AS "LastName", TRIM(p.middlename) AS "MiddleName", p.namestyle AS "NameStyle", TRIM(e.jobtitle) AS "Title", e.hiredate::date AS "HireDate", e.birthdate::date AS "BirthDate", TRIM(e.loginid) AS "LoginID", TRIM(ea.emailaddress) AS "EmailAddress", TRIM(pp.phonenumber) AS "Phone", TRIM(e.maritalstatus) AS "MaritalStatus", NULL::text AS "EmergencyContactName", NULL::text AS "EmergencyContactPhone", e.salariedflag AS "SalariedFlag", TRIM(e.gender) AS "Gender", eph.payfrequency AS "PayFrequency", eph.rate AS "BaseRate", e.vacationhours AS "VacationHours", e.sickleavehours AS "SickLeaveHours", e.currentflag AS "CurrentFlag", CASE WHEN sales_sp.businessentityid IS NULL THEN 0 ELSE 1 END AS "SalesPersonFlag", TRIM(d.name) AS "DepartmentName", e.hiredate::date AS "StartDate", CASE WHEN e.currentflag THEN NULL ELSE edh_last.enddate END AS "EndDate", CASE WHEN e.currentflag THEN 'Current' ELSE 'Inactive' END AS "Status", NULL::bytea AS "EmployeePhoto"
        FROM humanresources.employee e LEFT JOIN person.person p ON e.businessentityid=p.businessentityid LEFT JOIN person.emailaddress ea ON e.businessentityid=ea.businessentityid LEFT JOIN person.personphone pp ON e.businessentityid=pp.businessentityid LEFT JOIN sales.salesperson sales_sp ON e.businessentityid=sales_sp.businessentityid LEFT JOIN LATERAL (SELECT payfrequency, rate FROM humanresources.employeepayhistory WHERE businessentityid=e.businessentityid ORDER BY ratechangedate DESC LIMIT 1) eph ON true LEFT JOIN humanresources.employeedepartmenthistory edh ON e.businessentityid=edh.businessentityid AND edh.enddate IS NULL LEFT JOIN humanresources.department d ON edh.departmentid=d.departmentid LEFT JOIN LATERAL (SELECT enddate FROM humanresources.employeedepartmenthistory WHERE businessentityid=e.businessentityid ORDER BY enddate DESC NULLS LAST LIMIT 1) edh_last ON true LEFT JOIN humanresources.employee mgr ON mgr.organizationlevel = e.organizationlevel - 1 AND e.organizationnode::text LIKE mgr.organizationnode::text || '%' LEFT JOIN person.businessentityaddress bea ON e.businessentityid=bea.businessentityid LEFT JOIN person.address addr ON bea.addressid=addr.addressid LEFT JOIN person.stateprovince addr_sp ON addr.stateprovinceid=addr_sp.stateprovinceid
    target:
      connection: target_snowflake
      query: |
        SELECT de.EmployeeNationalIDAlternateKey AS "EmployeeNationalIDAlternateKey", pde.EmployeeNationalIDAlternateKey AS "ParentEmployeeNationalIDAlternateKey", dst.SalesTerritoryAlternateKey AS "SalesTerritoryAlternateKey", de.FirstName AS "FirstName", de.LastName AS "LastName", de.MiddleName AS "MiddleName", de.NameStyle AS "NameStyle", de.Title AS "Title", de.HireDate AS "HireDate", de.BirthDate AS "BirthDate", de.LoginID AS "LoginID", de.EmailAddress AS "EmailAddress", de.Phone AS "Phone", de.MaritalStatus AS "MaritalStatus", de.EmergencyContactName AS "EmergencyContactName", de.EmergencyContactPhone AS "EmergencyContactPhone", de.SalariedFlag AS "SalariedFlag", de.Gender AS "Gender", de.PayFrequency AS "PayFrequency", de.BaseRate AS "BaseRate", de.VacationHours AS "VacationHours", de.SickLeaveHours AS "SickLeaveHours", de.CurrentFlag AS "CurrentFlag", de.SalesPersonFlag AS "SalesPersonFlag", de.DepartmentName AS "DepartmentName", de.StartDate AS "StartDate", de.EndDate AS "EndDate", de.Status AS "Status", de.EmployeePhoto AS "EmployeePhoto"
        FROM public.dimemployee de LEFT JOIN public.dimemployee pde ON de.ParentEmployeeKey=pde.EmployeeKey LEFT JOIN public.dimsalesterritory dst ON de.SalesTerritoryKey=dst.SalesTerritoryKey WHERE de.Status = 'Current'
    primary_key: [EmployeeNationalIDAlternateKey]
    compare_columns: [ParentEmployeeNationalIDAlternateKey, SalesTerritoryAlternateKey, FirstName, LastName, MiddleName, NameStyle, Title, HireDate, BirthDate, LoginID, EmailAddress, Phone, MaritalStatus, EmergencyContactName, EmergencyContactPhone, SalariedFlag, Gender, PayFrequency, BaseRate, VacationHours, SickLeaveHours, CurrentFlag, SalesPersonFlag, DepartmentName, StartDate, EndDate, Status, EmployeePhoto]
    validations:
      aggregate:
        metrics:
          - column: EmployeeNationalIDAlternateKey
            checks: [count_distinct, null_count]
          - column: DepartmentName
            checks: [count_distinct, null_count]
          - column: Status
            checks: [count_distinct, null_count]
