  - name: fact_call_center_validation
    mapping_mode: query_to_query
    source:
      connection: source_postgres
      query: |
        SELECT "FactCallCenterID", TO_CHAR("Date"::date,'YYYYMMDD')::integer AS "DateKey", "WageType", "Shift", "LevelOneOperators", "LevelTwoOperators", "TotalOperators", "Calls", "AutomaticResponses", "Orders", "IssuesRaised", "AverageTimePerIssue", "ServiceGrade", "Date"::date AS "Date" FROM public.factcallcenter
    target:
      connection: target_snowflake
      query: |
        SELECT FactCallCenterID AS "FactCallCenterID", DateKey AS "DateKey", WageType AS "WageType", Shift AS "Shift", LevelOneOperators AS "LevelOneOperators", LevelTwoOperators AS "LevelTwoOperators", TotalOperators AS "TotalOperators", Calls AS "Calls", AutomaticResponses AS "AutomaticResponses", Orders AS "Orders", IssuesRaised AS "IssuesRaised", AverageTimePerIssue AS "AverageTimePerIssue", ServiceGrade AS "ServiceGrade", Date AS "Date" FROM public.factcallcenter
    primary_key: [FactCallCenterID]
    compare_columns: [DateKey, WageType, Shift, LevelOneOperators, LevelTwoOperators, TotalOperators, Calls, AutomaticResponses, Orders, IssuesRaised, AverageTimePerIssue, ServiceGrade, Date]
    validations:
      aggregate:
        metrics:
          - column: DateKey
            checks: [count_distinct, null_count]
          - column: WageType
            checks: [count_distinct, null_count]
          - column: Shift
            checks: [count_distinct, null_count]
  - name: fact_product_inventory_validation
    mapping_mode: query_to_query
    source:
      connection: source_postgres
      query: |
        SELECT p.productnumber AS "ProductAlternateKey", TO_CHAR(th.transactiondate::date,'YYYYMMDD')::integer AS "DateKey", TO_CHAR(th.transactiondate::date,'YYYY-MM-DD') AS "MovementDate", SUM(th.actualcost) AS "UnitCost", SUM(CASE WHEN th.transactiontype IN ('P','W') THEN th.quantity ELSE 0 END) AS "UnitsIn", SUM(CASE WHEN th.transactiontype='S' THEN th.quantity ELSE 0 END) AS "UnitsOut", SUM(CASE WHEN th.transactiontype IN ('P','W') THEN th.quantity WHEN th.transactiontype='S' THEN -th.quantity ELSE 0 END) AS "UnitsBalance"
        FROM production.transactionhistory th JOIN production.product p ON th.productid=p.productid
        GROUP BY p.productnumber, th.transactiondate::date
    target:
      connection: target_snowflake
      query: |
        SELECT dp.ProductAlternateKey AS "ProductAlternateKey", fpi.DateKey AS "DateKey", TO_VARCHAR(fpi.MovementDate, 'YYYY-MM-DD') AS "MovementDate", fpi.UnitCost AS "UnitCost", fpi.UnitsIn AS "UnitsIn", fpi.UnitsOut AS "UnitsOut", fpi.UnitsBalance AS "UnitsBalance" FROM public.factproductinventory fpi LEFT JOIN public.dimproduct dp ON fpi.ProductKey=dp.ProductKey WHERE dp.Status = 'Current' AND dp.EndDate IS NULL
    primary_key: [ProductAlternateKey, DateKey, MovementDate]
    compare_columns: [UnitCost, UnitsIn, UnitsOut, UnitsBalance]
    validations:
      aggregate:
        metrics:
          - column: UnitsIn
            checks: [sum]
          - column: UnitsOut
            checks: [sum]
          - column: UnitsBalance
            checks: [sum]
  - name: fact_sales_quota_validation
    mapping_mode: query_to_query
    source:
      connection: source_postgres
      query: |
        SELECT e.nationalidnumber AS "EmployeeNationalIDAlternateKey", TO_CHAR(sq.quotadate::date,'YYYYMMDD')::integer AS "DateKey", EXTRACT(YEAR FROM sq.quotadate)::integer AS "CalendarYear", EXTRACT(QUARTER FROM sq.quotadate)::integer AS "CalendarQuarter", sq.salesquota AS "SalesAmountQuota", sq.quotadate::date AS "Date" FROM sales.salespersonquotahistory sq JOIN humanresources.employee e ON sq.businessentityid=e.businessentityid
    target:
      connection: target_snowflake
      query: |
        SELECT de.EmployeeNationalIDAlternateKey AS "EmployeeNationalIDAlternateKey", fsq.DateKey AS "DateKey", fsq.CalendarYear AS "CalendarYear", fsq.CalendarQuarter AS "CalendarQuarter", fsq.SalesAmountQuota AS "SalesAmountQuota", fsq.Date AS "Date" FROM public.factsalesquota fsq LEFT JOIN public.dimemployee de ON fsq.EmployeeKey=de.EmployeeKey
    primary_key: [EmployeeNationalIDAlternateKey, DateKey]
    compare_columns: [CalendarYear, CalendarQuarter, SalesAmountQuota, Date]
    validations:
      aggregate:
        metrics:
          - column: SalesAmountQuota
            checks: [sum, avg]
  - name: fact_finance_validation
    mapping_mode: query_to_query
    source:
      connection: source_postgres
      query: |
        SELECT ff.datekey AS "DateKey", ff.organizationkey AS "OrganizationKey", ff.departmentgroupkey AS "DepartmentGroupKey", ff.scenariokey AS "ScenarioKey", ff.accountkey AS "AccountKey", ff.amount AS "Amount", ff.date::date AS "Date" FROM public.factfinance ff
    target:
      connection: target_snowflake
      query: |
        SELECT DateKey AS "DateKey", OrganizationKey AS "OrganizationKey", DepartmentGroupKey AS "DepartmentGroupKey", ScenarioKey AS "ScenarioKey", AccountKey AS "AccountKey", Amount AS "Amount", Date AS "Date" FROM public.factfinance
    primary_key: [DateKey, OrganizationKey, DepartmentGroupKey, ScenarioKey, AccountKey]
    compare_columns: [Amount, Date]
    validations:
      aggregate:
        metrics:
          - column: Amount
            checks: [sum, avg]
      statistical:
        metrics:
          - column: Amount
            checks: [mean, stddev]
  - name: fact_reseller_sales_validation
    mapping_mode: query_to_query
    source:
      connection: source_postgres
      query: |
        WITH fact_source AS (
          SELECT soh.salesorderid, ROW_NUMBER() OVER (PARTITION BY soh.salesorderid ORDER BY sod.salesorderdetailid) AS sales_order_line_number,
                 soh.salesordernumber, soh.revisionnumber, soh.orderdate AS order_date,
                 soh.duedate AS due_date, soh.shipdate AS ship_date, soh.customerid,
                 soh.salespersonid, soh.territoryid, cr.tocurrencycode, sod.productid,
                 sod.specialofferid, sod.orderqty, sod.unitprice, sod.unitpricediscount,
                 sod.linetotal, sod.carriertrackingnumber, soh.purchaseordernumber,
                 soh.taxamt, soh.freight
          FROM sales.salesorderheader soh
          JOIN sales.salesorderdetail sod ON soh.salesorderid = sod.salesorderid
          LEFT JOIN sales.currencyrate cr ON soh.currencyrateid = cr.currencyrateid
          WHERE soh.onlineorderflag = FALSE
        )
        SELECT fs.salesordernumber AS "SalesOrderNumber",
               fs.sales_order_line_number AS "SalesOrderLineNumber",
               p.productnumber AS "ProductAlternateKey",
               'AW' || LPAD(s.businessentityid::text, 8, '0') AS "ResellerAlternateKey",
               e.nationalidnumber AS "EmployeeNationalIDAlternateKey",
               fs.specialofferid AS "PromotionAlternateKey",
               COALESCE(fs.tocurrencycode, 'USD') AS "CurrencyAlternateKey",
               fs.territoryid AS "SalesTerritoryAlternateKey",
               TO_CHAR(fs.order_date::date, 'YYYYMMDD')::integer AS "OrderDateKey",
               TO_CHAR(fs.due_date::date, 'YYYYMMDD')::integer AS "DueDateKey",
               TO_CHAR(fs.ship_date::date, 'YYYYMMDD')::integer AS "ShipDateKey",
               fs.revisionnumber AS "RevisionNumber", fs.orderqty AS "OrderQuantity",
               fs.unitprice AS "UnitPrice", fs.linetotal AS "ExtendedAmount",
               fs.unitpricediscount AS "UnitPriceDiscountPct",
               fs.orderqty * fs.unitprice * fs.unitpricediscount AS "DiscountAmount",
               p.standardcost AS "ProductStandardCost",
               fs.orderqty * p.standardcost AS "TotalProductCost",
               fs.orderqty * fs.unitprice AS "SalesAmount", fs.taxamt AS "TaxAmt",
               fs.freight AS "Freight", fs.carriertrackingnumber AS "CarrierTrackingNumber",
               fs.purchaseordernumber AS "CustomerPONumber", fs.order_date AS "OrderDate",
               fs.due_date AS "DueDate", fs.ship_date AS "ShipDate"
        FROM fact_source fs
        JOIN production.product p ON fs.productid = p.productid
        JOIN sales.customer c ON fs.customerid = c.customerid
        JOIN sales.store s ON c.storeid = s.businessentityid
        LEFT JOIN humanresources.employee e ON fs.salespersonid = e.businessentityid
    target:
      connection: target_snowflake
      query: |
        SELECT frs.SalesOrderNumber AS "SalesOrderNumber", frs.SalesOrderLineNumber AS "SalesOrderLineNumber",
               dp.ProductAlternateKey AS "ProductAlternateKey", dr.ResellerAlternateKey AS "ResellerAlternateKey",
               de.EmployeeNationalIDAlternateKey AS "EmployeeNationalIDAlternateKey",
               dpr.PromotionAlternateKey AS "PromotionAlternateKey", dcu.CurrencyAlternateKey AS "CurrencyAlternateKey",
               dst.SalesTerritoryAlternateKey AS "SalesTerritoryAlternateKey", frs.OrderDateKey AS "OrderDateKey",
               frs.DueDateKey AS "DueDateKey", frs.ShipDateKey AS "ShipDateKey", frs.RevisionNumber AS "RevisionNumber",
               frs.OrderQuantity AS "OrderQuantity", frs.UnitPrice AS "UnitPrice", frs.ExtendedAmount AS "ExtendedAmount",
               frs.UnitPriceDiscountPct AS "UnitPriceDiscountPct", frs.DiscountAmount AS "DiscountAmount",
               frs.ProductStandardCost AS "ProductStandardCost", frs.TotalProductCost AS "TotalProductCost",
               frs.SalesAmount AS "SalesAmount", frs.TaxAmt AS "TaxAmt", frs.Freight AS "Freight",
               frs.CarrierTrackingNumber AS "CarrierTrackingNumber", frs.CustomerPONumber AS "CustomerPONumber",
               frs.OrderDate AS "OrderDate", frs.DueDate AS "DueDate", frs.ShipDate AS "ShipDate"
        FROM public.factresellersales frs
        LEFT JOIN public.dimproduct dp ON frs.ProductKey = dp.ProductKey
        LEFT JOIN public.dimreseller dr ON frs.ResellerKey = dr.ResellerKey
        LEFT JOIN public.dimemployee de ON frs.EmployeeKey = de.EmployeeKey
        LEFT JOIN public.dimpromotion dpr ON frs.PromotionKey = dpr.PromotionKey
        LEFT JOIN public.dimcurrency dcu ON frs.CurrencyKey = dcu.CurrencyKey
        LEFT JOIN public.dimsalesterritory dst ON frs.SalesTerritoryKey = dst.SalesTerritoryKey
    primary_key: [SalesOrderNumber, SalesOrderLineNumber]
    compare_columns: [ProductAlternateKey, ResellerAlternateKey, EmployeeNationalIDAlternateKey, PromotionAlternateKey, CurrencyAlternateKey, SalesTerritoryAlternateKey, OrderDateKey, DueDateKey, ShipDateKey, RevisionNumber, OrderQuantity, UnitPrice, ExtendedAmount, UnitPriceDiscountPct, DiscountAmount, ProductStandardCost, TotalProductCost, SalesAmount, TaxAmt, Freight, CarrierTrackingNumber, CustomerPONumber, OrderDate, DueDate, ShipDate]
    validations:
      aggregate:
        group_by: [OrderDateKey]
        metrics:
          - column: OrderQuantity
            checks: [sum, count]
          - column: SalesAmount
            checks: [sum, avg]
          - column: ExtendedAmount
            checks: [sum]
      statistical:
        metrics:
          - column: UnitPrice
            checks: [mean, stddev, p50]
          - column: SalesAmount
            checks: [mean, stddev]
          - column: OrderQuantity
            checks: [mean, stddev]
  - name: fact_intl_product_desc_validation
    mapping_mode: query_to_query
    source:
      connection: source_postgres
      query: |
        SELECT p.productnumber AS "ProductAlternateKey", TRIM(c.cultureid) AS "CultureName", pd.description AS "ProductDescription" FROM production.product p JOIN production.productmodelproductdescriptionculture pmpdc ON p.productmodelid=pmpdc.productmodelid JOIN production.productdescription pd ON pmpdc.productdescriptionid=pd.productdescriptionid JOIN production.culture c ON pmpdc.cultureid=c.cultureid
    target:
      connection: target_snowflake
      query: |
        SELECT dp.ProductAlternateKey AS "ProductAlternateKey", fa.CultureName AS "CultureName", fa.ProductDescription AS "ProductDescription" FROM public.factadditionalinternationalproductdescription fa LEFT JOIN public.dimproduct dp ON fa.ProductKey=dp.ProductKey WHERE dp.Status = 'Current' AND dp.EndDate IS NULL
    primary_key: [ProductAlternateKey, CultureName]
    compare_columns: [ProductDescription]
    validations:
      aggregate:
        metrics:
          - column: CultureName
            checks: [count_distinct, null_count]
          - column: ProductDescription
            checks: [count_distinct, null_count]
  - name: fact_survey_response_validation
    mapping_mode: query_to_query
    source:
      connection: source_postgres
      query: |
        SELECT TO_CHAR(sr.date::date,'YYYYMMDD')::integer AS "DateKey", sr.customeralternatekey AS "CustomerAlternateKey", sr.productcategoryalternatekey AS "ProductCategoryAlternateKey", sr.productsubcategoryalternatekey AS "ProductSubcategoryAlternateKey", sr.date::date AS "Date" FROM public.surveyresponse sr
    target:
      connection: target_snowflake
      query: |
        SELECT fsr.DateKey AS "DateKey", dc.CustomerAlternateKey AS "CustomerAlternateKey", dpc.ProductCategoryAlternateKey AS "ProductCategoryAlternateKey", dps.ProductSubcategoryAlternateKey AS "ProductSubcategoryAlternateKey", fsr.Date AS "Date" FROM public.factsurveyresponse fsr LEFT JOIN public.dimcustomer dc ON fsr.CustomerKey=dc.CustomerKey LEFT JOIN public.dimproductcategory dpc ON fsr.ProductCategoryKey=dpc.ProductCategoryKey LEFT JOIN public.dimproductsubcategory dps ON fsr.ProductSubcategoryKey=dps.ProductSubcategoryKey
    primary_key: [DateKey, CustomerAlternateKey, ProductCategoryAlternateKey, ProductSubcategoryAlternateKey]
    compare_columns: [Date]
    validations:
      aggregate:
        metrics:
          - column: DateKey
            checks: [count_distinct, null_count]
          - column: CustomerAlternateKey
            checks: [count_distinct, null_count]

  - name: dim_scenario_validation
    mapping_mode: query_to_query
    source:
      connection: source_postgres
      query: |
        SELECT
          CAST(src.ScenarioKey AS BIGINT) AS "ScenarioKey",
          src.ScenarioName AS "ScenarioName"
        FROM (
          SELECT
            1 AS ScenarioKey,
            'Actual' AS ScenarioName

          UNION ALL

          SELECT
            2 AS ScenarioKey,
            'Budget' AS ScenarioName

          UNION ALL

          SELECT
            3 AS ScenarioKey,
            'Forecast' AS ScenarioName
        ) src

    target:
      connection: target_snowflake
      query: |
        SELECT
          CAST(ScenarioKey AS BIGINT) AS "ScenarioKey",
          ScenarioName AS "ScenarioName"
        FROM public.dimscenario

    primary_key: [ScenarioKey]
    compare_columns: [ScenarioName]

    validations:
      aggregate:
        metrics:
          - column: ScenarioName
            checks: [count_distinct, null_count]

      statistical:
        metrics:
          - column: ScenarioName
            checks: [distinct_count, null_rate]