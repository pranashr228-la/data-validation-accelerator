  - name: dim_reseller_validation
    mapping_mode: query_to_query
    source:
      connection: source_postgres
      query: |
        SELECT
            'AW' || LPAD(s.businessentityid::text, 8, '0') AS "ResellerAlternateKey",
            CONCAT_WS('|', COALESCE(a.city,''), COALESCE(sp.stateprovincecode,''), COALESCE(cr.countryregioncode,''), COALESCE(a.postalcode,'')) AS "GeographyNaturalKey",
            MAX(pp.phonenumber) AS "Phone",
            (xpath('//*[local-name()="BusinessType"]/text()', s.demographics::xml))[1]::text AS "BusinessType",
            TRIM(s.name) AS "ResellerName",
            ((xpath('//*[local-name()="NumberEmployees"]/text()', s.demographics::xml))[1]::text)::integer AS "NumberEmployees",
            NULL::text AS "OrderFrequency",
            NULL::integer AS "OrderMonth",
            EXTRACT(YEAR FROM MIN(soh.orderdate))::integer AS "FirstOrderYear",
            EXTRACT(YEAR FROM MAX(soh.orderdate))::integer AS "LastOrderYear",
            (xpath('//*[local-name()="Specialty"]/text()', s.demographics::xml))[1]::text AS "ProductLine",
            MAX(a.addressline1) AS "AddressLine1",
            MAX(a.addressline2) AS "AddressLine2",
            ((xpath('//*[local-name()="AnnualSales"]/text()', s.demographics::xml))[1]::text)::numeric AS "AnnualSales",
            (xpath('//*[local-name()="BankName"]/text()', s.demographics::xml))[1]::text AS "BankName",
            NULL::integer AS "MinPaymentType",
            NULL::numeric AS "MinPaymentAmount",
            ((xpath('//*[local-name()="AnnualRevenue"]/text()', s.demographics::xml))[1]::text)::numeric AS "AnnualRevenue",
            ((xpath('//*[local-name()="YearOpened"]/text()', s.demographics::xml))[1]::text)::integer AS "YearOpened"
        FROM sales.store s
        LEFT JOIN person.businessentityaddress bea ON s.businessentityid=bea.businessentityid
        LEFT JOIN person.address a ON bea.addressid=a.addressid
        LEFT JOIN person.stateprovince sp ON a.stateprovinceid=sp.stateprovinceid
        LEFT JOIN person.countryregion cr ON sp.countryregioncode=cr.countryregioncode
        LEFT JOIN person.person per ON s.businessentityid=per.businessentityid
        LEFT JOIN person.personphone pp ON per.businessentityid=pp.businessentityid
        LEFT JOIN sales.customer c ON s.businessentityid=c.storeid
        LEFT JOIN sales.salesorderheader soh ON c.customerid=soh.customerid
        GROUP BY s.businessentityid, s.name, s.demographics, a.city, sp.stateprovincecode, cr.countryregioncode, a.postalcode
    target:
      connection: target_snowflake
      query: |
        SELECT dr.ResellerAlternateKey AS "ResellerAlternateKey", CONCAT_WS('|',dg.City,dg.StateProvinceCode,dg.CountryRegionCode,dg.PostalCode) AS "GeographyNaturalKey", dr.Phone AS "Phone", dr.BusinessType AS "BusinessType", dr.ResellerName AS "ResellerName", dr.NumberEmployees AS "NumberEmployees", dr.OrderFrequency AS "OrderFrequency", dr.OrderMonth AS "OrderMonth", dr.FirstOrderYear AS "FirstOrderYear", dr.LastOrderYear AS "LastOrderYear", dr.ProductLine AS "ProductLine", dr.AddressLine1 AS "AddressLine1", dr.AddressLine2 AS "AddressLine2", dr.AnnualSales AS "AnnualSales", dr.BankName AS "BankName", dr.MinPaymentType AS "MinPaymentType", dr.MinPaymentAmount AS "MinPaymentAmount", dr.AnnualRevenue AS "AnnualRevenue", dr.YearOpened AS "YearOpened"
        FROM public.dimreseller dr LEFT JOIN public.dimgeography dg ON dr.GeographyKey=dg.GeographyKey
    primary_key: [ResellerName]
    compare_columns: [GeographyNaturalKey, Phone, BusinessType, NumberEmployees, OrderFrequency, OrderMonth, FirstOrderYear, LastOrderYear, ProductLine, AddressLine1, AddressLine2, AnnualSales, BankName, MinPaymentType, MinPaymentAmount, AnnualRevenue, YearOpened]
    validations:
      aggregate:
        metrics:
          - column: ResellerAlternateKey
            checks: [count_distinct, null_count]
          - column: ResellerName
            checks: [count_distinct, null_count]
          - column: FirstOrderYear
            checks: [count_distinct, null_count]
          - column: LastOrderYear
            checks: [count_distinct, null_count]
  - name: fact_currency_rate_validation
