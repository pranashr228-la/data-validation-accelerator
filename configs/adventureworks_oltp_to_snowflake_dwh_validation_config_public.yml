      query: |
        SELECT * FROM (VALUES (NULL,1,NULL,'Balance Sheet',NULL,'~',NULL,'Currency',NULL),(1,10,1,'Assets','Assets','+',NULL,'Currency',NULL),(2,110,10,'Current Assets','Assets','+',NULL,'Currency',NULL),(3,1110,110,'Cash','Assets','+',NULL,'Currency',NULL),(3,1120,110,'Receivables','Assets','+',NULL,'Currency',NULL),(5,1130,1120,'Trade Receivables','Assets','+',NULL,'Currency',NULL),(5,1140,1120,'Other Receivables','Assets','+',NULL,'Currency',NULL),(3,1150,110,'Allowance for Bad Debt','Assets','+',NULL,'Currency',NULL),(3,1160,110,'Inventory','Assets','+',NULL,'Currency',NULL),(9,1162,1160,'Raw Materials','Assets','+',NULL,'Currency',NULL)) AS src("ParentAccountKey","AccountCodeAlternateKey","ParentAccountCodeAlternateKey","AccountDescription","AccountType","Operator","CustomMembers","ValueType","CustomMemberOptions")
    target:
