      query: |
        SELECT cr.tocurrencycode AS "CurrencyAlternateKey", TO_CHAR(cr.currencyratedate::date,'YYYYMMDD')::integer AS "DateKey", cr.averagerate AS "AverageRate", cr.endofdayrate AS "EndOfDayRate", cr.currencyratedate::date AS "Date"
